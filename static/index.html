<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>go2rtc</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.onerror = function (msg, src, line) {
      var text = 'Errore JS: ' + msg + ' (' + line + ')';
      // Read the flag from storage: if app.js itself fails to load, nothing else sets it.
      try { if (!JSON.parse(localStorage.getItem('go2rtc-tizen.settings') || '{}').debug) return; } catch (e) { return; }
      var el = document.getElementById('status');
      if (el) el.textContent = text;
      var lg = document.getElementById('log');
      if (lg) lg.textContent += '\n' + text;
    };
  </script>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <header><h1>go2rtc</h1><span id="status"></span><span class="hint">Tasto rosso (A) o ▲ = impostazioni</span></header>

  <main id="grid" class="grid"></main>

  <section id="player" hidden>
    <video id="video" autoplay muted playsinline></video>
    <object id="avplay" type="application/avplayer"></object>
    <div id="player-label"></div>
    <pre id="log"></pre>
  </section>

  <section id="settings" hidden>
    <h2>Impostazioni</h2>
    <div class="row">
      <label class="narrow">Protocollo
        <select id="cfg-protocol" class="focusable"><option value="http">http</option><option value="https">https</option></select>
      </label>
      <label class="grow">Indirizzo IP <input id="cfg-host" class="focusable" placeholder="192.168.1.10"></label>
      <label class="narrow">Porta <input id="cfg-port" class="focusable" type="number" placeholder="1984"></label>
    </div>
    <label>Modalità player
      <select id="cfg-mode" class="focusable">
        <option value="auto">Auto (MSE → HLS)</option>
        <option value="mse">MSE</option>
        <option value="hls">HLS (AVPlay)</option>
      </select>
    </label>
    <label>Refresh anteprime (s) <input id="cfg-refresh" class="focusable" type="number" min="2" max="60"></label>
    <label>Debug (log ed errori a schermo)
      <select id="cfg-debug" class="focusable"><option value="0">Off</option><option value="1">On</option></select>
    </label>
    <button id="cfg-save" class="focusable">Salva</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
